name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger when pushing to the main branch
  pull_request:
    branches:
      - main  # Trigger when creating a pull request to the main branch

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu image

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up Docker Buildx (for multi-platform builds if needed)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    # Step 3: Log in to DockerHub (only if pushing to DockerHub)
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # Use GitHub secrets for security
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 4: Build the Docker image
    - name: Build Docker image
      run: |
        docker build -t your-dockerhub-username/your-repo-name .

    # Step 5: Run tests (if you have tests; this step is optional)
    - name: Run tests in Docker
      run: |
        docker run --rm your-dockerhub-username/your-repo-name pytest  # Replace pytest with your test command

    # Step 6: Push Docker image to DockerHub (optional, only if you need to deploy)
    - name: Push Docker image to DockerHub
      run: |
        docker tag your-dockerhub-username/your-repo-name your-dockerhub-username/your-repo-name:latest
        docker push your-dockerhub-username/your-repo-name:latest
