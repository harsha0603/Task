name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the 'main' branch
  pull_request:
    branches:
      - main  # Trigger the workflow when a PR is opened to the 'main' branch
  paths:
      - '!README.md'

jobs:
  build:
    runs-on: ubuntu-latest  # Use an Ubuntu runner to build the image

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Checks out the repository code

    - name: List files
      run: |
        ls -la  # List the files in the repository to confirm Dockerfile presence

    - name: Log in to DockerHub
      uses: docker/login-action@v2  # Logs in to DockerHub using credentials
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # DockerHub username from GitHub secrets
        password: ${{ secrets.DOCKER_PASSWORD }}  # DockerHub password from GitHub secrets

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/task-app:latest .  # Build the Docker image with the latest tag

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/task-app:latest  # Push the image to DockerHub
